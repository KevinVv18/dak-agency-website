name: Deploy panel de ventas

# Publica _sales-center/ en el docroot de ventas.dakagency.net
# (/home/u567580447/domains/dakagency.net/public_html/ventas).
#
# Es una app Vite APARTE de la SPA principal, con su propio package.json. Por eso
# todos los pasos llevan working-directory y no se mezcla con el build de la raiz.
#
# ⚠️ El panel lleva nombres de empresas prospecto, telefonos y mensajes de venta
#    sin enviar. El muro es Basic Auth y sale del propio build: publico/.htaccess
#    -> dist/.htaccess via `publicDir` en vite.config.js. Si alguien quita ese
#    ajuste, el panel se publica desnudo. El paso "Comprobar que el muro viaja"
#    de abajo esta para que eso falle el deploy en vez de pasar desapercibido.
#
# ⚠️ 'ventas/' DEBE seguir en deploy-protect.txt o el deploy de la SPA lo borra.
#
# Dispara:
#  - manualmente (workflow_dispatch)
#  - push a main que toque _sales-center/**

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '_sales-center/**'
      - '.github/workflows/deploy-ventas.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _sales-center

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: _sales-center/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # Sin estos dos secretos el panel compila igual y funciona: se queda en
      # solo lectura y los botones de escritura no aparecen. Es a proposito —
      # una compilacion sin secretos tiene que dar un panel que sirve, no uno
      # roto. Para activar la escritura desde CI hay que crearlos en
      # Settings > Secrets > Actions.
      - name: Build
        run: npm run build
        env:
          VITE_SHEETS_URL: ${{ secrets.VITE_SHEETS_URL }}
          VITE_SHEETS_TOKEN: ${{ secrets.VITE_SHEETS_TOKEN }}

      # El docroot se arma aqui: la puerta PHP en la raiz y el build DENTRO de
      # app/, que el .htaccess bloquea. Asi el unico camino hacia el HTML y el
      # JavaScript pasa por la comprobacion de sesion.
      - name: Armar el docroot (puerta + app)
        run: |
          set -euo pipefail
          rm -rf publicar && mkdir -p publicar
          cp -r gate/. publicar/
          mkdir -p publicar/app
          cp -r dist/. publicar/app/
          # El CLIENT_ID no es secreto —viaja en el HTML por diseño— pero se
          # inyecta desde el entorno para no tener que tocar codigo al rotarlo.
          if [ -n "${DAK_GOOGLE_CLIENT_ID:-}" ]; then
            sed -i "s#PENDIENTE.apps.googleusercontent.com#${DAK_GOOGLE_CLIENT_ID}#" publicar/config.php
          fi
          find publicar -maxdepth 2 -type f | sort
        env:
          DAK_GOOGLE_CLIENT_ID: ${{ secrets.DAK_GOOGLE_CLIENT_ID }}

      # Falla cerrado. Un panel con datos comerciales servido sin puerta es peor
      # que un deploy roto, asi que se comprueba ANTES de subir nada.
      - name: Comprobar que la puerta viaja armada
        run: |
          set -euo pipefail
          for archivo in publicar/index.php publicar/acceso.php publicar/config.php publicar/.htaccess publicar/app/index.html; do
            [ -f "$archivo" ] || { echo "::error::Falta $archivo"; exit 1; }
          done
          grep -q 'RewriteRule \^app(/|\$) - \[F,L\]' publicar/.htaccess \
            || { echo "::error::El .htaccess no bloquea app/. El build quedaria accesible sin sesion."; exit 1; }
          grep -q 'verificarConGoogle' publicar/index.php \
            || { echo "::error::index.php no verifica el token contra Google."; exit 1; }
          grep -q "DOMINIO_PERMITIDO" publicar/index.php \
            || { echo "::error::index.php no restringe por dominio."; exit 1; }
          if grep -q 'PENDIENTE.apps.googleusercontent.com' publicar/config.php; then
            echo "::error::Falta el secreto DAK_GOOGLE_CLIENT_ID. Nadie podria entrar."
            exit 1
          fi
          grep -q "Disallow: /" publicar/robots.txt || { echo "::error::robots.txt no bloquea a los rastreadores."; exit 1; }
          echo "OK: puerta armada, app/ bloqueada y dominio restringido."

      # --delete es seguro aqui: este docroot es exclusivo del panel y no tiene
      # nada que no produzca el build. De hecho hace falta, para que se lleve el
      # default.php que deja Hostinger al crear el subdominio.
      - name: Subir al docroot del subdominio (rsync)
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: _sales-center/publicar/
          remote_path: /home/u567580447/domains/dakagency.net/public_html/ventas/
          remote_host: 89.116.115.11
          remote_port: 65002
          remote_user: u567580447
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Comprobacion en vivo. No basta con que la raiz pida acceso: lo que hay
      # que demostrar es que el BUILD no se alcanza por ningun camino sin sesion.
      - name: Verificar en vivo que nada se sirve sin sesion
        run: |
          set -uo pipefail
          sleep 5
          fallos=0

          raiz=$(curl -s -o /tmp/raiz.html -w '%{http_code}' --max-time 25 https://ventas.dakagency.net/)
          echo "GET / -> $raiz"
          [ "$raiz" = "401" ] || { echo "::error::/ deberia dar 401 y dio $raiz"; fallos=1; }
          grep -q "accounts.google.com/gsi/client" /tmp/raiz.html \
            || { echo "::error::La raiz no sirve la pantalla de acceso de Google."; fallos=1; }

          # Lo importante: el panel no debe aparecer por ninguna de estas rutas.
          for ruta in /app/index.html /app/ /inicio /prospectos /assets/; do
            codigo=$(curl -s -o /tmp/x -w '%{http_code}' --max-time 25 "https://ventas.dakagency.net${ruta}")
            echo "GET $ruta -> $codigo"
            if grep -qs 'id="root"' /tmp/x; then
              echo "::error::${ruta} sirvio el panel SIN sesion. Esta expuesto."
              fallos=1
            fi
          done

          [ "$fallos" = "0" ] || exit 1
          echo "OK: sin sesion no se sirve ni el panel ni sus assets."
