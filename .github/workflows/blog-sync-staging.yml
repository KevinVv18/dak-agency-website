name: Blog Sync Staging (DAK)

# Sincroniza _blog-content/ → staging del servidor (~/dak-autopost) SIN
# publicar nada. Úsalo cuando se agregan posts a la cola y quieres que el
# cron del servidor (hPanel, Lun/Mié/Vie 09:00 Perú) los vea sin esperar a
# un disparo de "Blog Auto-Publish".
#
# Contexto: el cron publica desde el staging, y el staging solo se actualiza
# por rsync desde Actions. Si se encola contenido y nadie sincroniza, el cron
# se queda "sin nada nuevo" indefinidamente (pasó del 03-jul al 13-jul-2026,
# y otra vez del 25-jul al 30-jul-2026).
#
# Por eso ahora se dispara SOLO cuando cambia _blog-content/ en main: encolar
# un post y mergear ya deja el staging listo para el próximo cron, sin que
# nadie tenga que acordarse de correr el workflow a mano. Sigue disponible el
# disparo manual. Este workflow NO publica: solo espeja el contenido.

on:
  push:
    branches:
      - main
    paths:
      - '_blog-content/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-autopublish
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Subir contenido al servidor (solo rsync, no publica)
        uses: burnett01/rsync-deployments@7.0.1
        with:
          # cron.log es la bitácora que escribe el cron del servidor; sin
          # excluirla, cada sync la borraba y nos quedábamos sin saber si el
          # cron corrió.
          switches: -avz --delete --exclude=cron.log
          path: _blog-content/
          remote_path: /home/u567580447/dak-autopost/
          remote_host: 89.116.115.11
          remote_port: 65002
          remote_user: u567580447
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
