name: Deploy demo agroinsumos (ARENAL)

# Publica el sitio-demo estático de _agro-demo/ en el docroot del subdominio
# agro.dakagency.net
# (/home/u567580447/domains/dakagency.net/public_html/agro).
#
# OJO: el rsync de la SPA en deploy.yml usa --delete sobre public_html/, así que
# 'agro/' DEBE estar en su lista de --exclude o ese deploy borra este demo.
# (Es la trampa que ya se llevó por delante el demo inmobiliario una vez.)
#
# Dispara:
#  - manualmente (workflow_dispatch)
#  - push a main que toque _agro-demo/**
#  - push en CUALQUIER rama cuyo commit incluya [deploy-agro]
#
# A diferencia de deploy-inmobiliaria.yml, aquí NO se filtra por `branches:`:
# ese filtro se evalúa ANTES del `if:` del job, así que un push a una rama nunca
# dispararía el workflow y el marcador [deploy-agro] sería código muerto.
# Sin `branches:`, el `if:` de abajo es quien decide — y así se puede
# previsualizar el demo en el subdominio real antes de mergear a main.

on:
  workflow_dispatch:
  push:
    paths:
      - '_agro-demo/**'
      - '.github/workflows/deploy-agro.yml'

permissions:
  contents: read

# Dos pushes seguidos no deben solapar dos `rsync --delete` sobre el mismo
# docroot: se serializan.
concurrency:
  group: deploy-agro
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-agro]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # El sitio se construye aquí, no en la máquina de nadie. Así no existe el
      # modo de fallo "¿generaste antes de desplegar?" y lo que se sube es
      # siempre lo que está en la rama.
      - name: Generar el sitio
        run: node _agro-demo/generar.js

      # Guarda de confidencialidad. El sitio PÚBLICO usa una marca ficticia
      # (ARENAL). Las maquetas con la marca real de un prospecto viven en
      # carpetas `p-*` con noindex y sin enlaces entrantes, donde esos nombres
      # sí corresponden. Aquí se comprueba que no se hayan colado fuera de ahí.
      #
      # Se revisa la SALIDA generada y no los fuentes, porque es la salida lo
      # que se publica.
      - name: Verificar que el sitio público no filtra datos de prospectos
        run: |
          set -e
          PATRON='ExcelAg|Evergreen|Saeta|Nemakill|Best-K|Fender|Aramite|Slam Org|Jaque Mate|Hermer|Gavidia'
          if grep -rinE "$PATRON" _agro-demo/dist \
               --include='*.html' --include='*.js' --include='*.css' --include='*.xml' \
               --exclude-dir='p-*'; then
            echo "::error::Datos de un prospecto en el sitio público. Su sitio va en una carpeta p-*."
            exit 1
          fi
          echo "OK: el sitio público está limpio."

      # Las maquetas privadas no deben ser alcanzables desde el sitio público:
      # ni enlazadas, ni listadas en el sitemap.
      - name: Verificar que las maquetas privadas no están enlazadas
        run: |
          set -e
          if grep -rn 'p-2026' _agro-demo/dist/index.html _agro-demo/dist/sitemap.xml 2>/dev/null; then
            echo "::error::Una maqueta privada quedó enlazada o listada en el sitemap."
            exit 1
          fi
          for f in _agro-demo/dist/p-*/index.html; do
            [ -e "$f" ] || continue
            grep -q 'noindex' "$f" || { echo "::error::$f sin noindex"; exit 1; }
          done
          echo "OK: maquetas privadas aisladas y con noindex."

      - name: Subir demo al docroot del subdominio (rsync en Docker)
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: _agro-demo/dist/
          remote_path: /home/u567580447/domains/dakagency.net/public_html/agro/
          remote_host: 89.116.115.11
          remote_port: 65002
          remote_user: u567580447
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
