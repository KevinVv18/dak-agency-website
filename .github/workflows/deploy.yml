name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # El postinstall de puppeteer se descarga Chromium (~150 MB). Cachearlo
      # evita repetir la descarga en cada deploy. Va ANTES de `npm ci` para que
      # el postinstall encuentre el navegador ya en su sitio.
      - name: Cache del navegador de Puppeteer
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: puppeteer-${{ runner.os }}-

      - name: Install Dependencies
        run: npm ci

      # `npm run build` es `vite build` seguido del prerender. Va junto a
      # proposito: si el prerender fuese un paso aparte, cualquiera podria
      # quitarlo del workflow y el sitio volveria a servir un <body> vacio a los
      # rastreadores sin que nadie se enterase.
      - name: Build Project
        run: npm run build
        env:
          # Crear estos 4 secrets en GitHub: Settings > Secrets > Actions.
          # Sin ellos, el formulario de contacto se compila SIN claves y no envía emails.
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_NOTIFICATION: ${{ secrets.VITE_EMAILJS_TEMPLATE_NOTIFICATION }}
          VITE_EMAILJS_TEMPLATE_AUTOREPLY: ${{ secrets.VITE_EMAILJS_TEMPLATE_AUTOREPLY }}

      # El build ya NO ejecuta deploy.sh (era no-op en el runner y el
      # `|| true` ocultaba fallos reales de vite build).
      #
      # El rsync de la SPA usa --delete sobre public_html/: todo lo que viva ahí
      # y no salga de `npm run build` desaparece en el siguiente push. Ya se
      # llevó el demo inmobiliario y el microsite de análisis.
      #
      # Antes esto se defendía con una lista de --exclude escrita a mano en este
      # archivo, y la regla "añádelo a main de inmediato" vivía en un comentario.
      # No funcionó: cada rama acabó con una lista distinta e incompleta, y el
      # 06-ago-2026 main volvía a estar a un push de borrar agro/.
      #
      # Ahora la lista vive en deploy-protect.txt, los --exclude se generan de
      # ahí, y el paso de guarda compara contra el servidor real. Una carpeta sin
      # proteger detiene el deploy en vez de desaparecer.

      - name: Construir excludes desde deploy-protect.txt
        id: protect
        run: |
          set -euo pipefail
          if [ ! -s deploy-protect.txt ]; then
            echo "::error::deploy-protect.txt no existe o está vacío. Sin él no se puede desplegar con --delete."
            exit 1
          fi
          DIRS=$(grep -vE '^\s*(#|$)' deploy-protect.txt | tr -d '\r' | sed 's#/*$#/#')
          SW="-avz --delete"
          for d in $DIRS; do SW="$SW --exclude='$d'"; done
          echo "switches=$SW" >> "$GITHUB_OUTPUT"
          echo "dirs<<EOF" >> "$GITHUB_OUTPUT"; echo "$DIRS" >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Protegidas: $(echo $DIRS | tr '\n' ' ')"
          echo "switches: $SW"

      # Guarda: si en el servidor hay algo que ni produce el build ni está
      # protegido, --delete lo borraría. Se para el deploy y se avisa con nombre
      # y apellido. Falla cerrado a propósito: si esta comprobación no se puede
      # hacer, no se despliega.
      - name: Guarda anti-borrado (comparar servidor vs protegidas)
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Sin `set -e` a proposito: cada fallo se comprueba y se explica. Con
          # -e y pipefail, un ssh caido mataba el paso antes de imprimir ningun
          # mensaje, y el log quedaba en blanco.
          set -uo pipefail

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "--- ssh-keyscan ---"
          if ! ssh-keyscan -p 65002 89.116.115.11 >> ~/.ssh/known_hosts; then
            echo "aviso: ssh-keyscan fallo; se continua con accept-new"
          fi

          REMOTE=/home/u567580447/domains/dakagency.net/public_html
          echo "--- listando public_html/ en el servidor ---"
          if ! ssh -i ~/.ssh/deploy_key -p 65002 \
                 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
                 u567580447@89.116.115.11 "ls -A '$REMOTE'" > /tmp/servidor.raw 2> /tmp/ssh.err; then
            echo "::error::No se pudo listar public_html/ por SSH. Se aborta sin desplegar."
            echo "salida de ssh:"; sed 's/^/  /' /tmp/ssh.err
            exit 1
          fi

          # LC_ALL=C en los tres sort: comm exige el mismo criterio de orden en
          # sus entradas y la locale del runner no es de fiar.
          tr -d '\r' < /tmp/servidor.raw | LC_ALL=C sort > /tmp/en-servidor.txt
          ls -A dist/ | tr -d '\r' | LC_ALL=C sort > /tmp/en-build.txt
          grep -vE '^\s*(#|$)' deploy-protect.txt | tr -d '\r' | sed 's#/*$##' | LC_ALL=C sort > /tmp/protegidas.txt

          echo "--- en el servidor ($(wc -l < /tmp/en-servidor.txt)) ---"; sed 's/^/  /' /tmp/en-servidor.txt
          echo "--- lo produce el build ($(wc -l < /tmp/en-build.txt)) ---"; sed 's/^/  /' /tmp/en-build.txt
          echo "--- protegidas ($(wc -l < /tmp/protegidas.txt)) ---"; sed 's/^/  /' /tmp/protegidas.txt

          if [ ! -s /tmp/en-servidor.txt ]; then
            echo "::error::El listado del servidor vino vacio. Se aborta sin desplegar."
            exit 1
          fi

          # Lo que sobrevive a ambas restas es lo que --delete se llevaría.
          comm -23 /tmp/en-servidor.txt /tmp/en-build.txt > /tmp/no-en-build.txt
          comm -23 /tmp/no-en-build.txt /tmp/protegidas.txt > /tmp/en-peligro.txt

          if [ -s /tmp/en-peligro.txt ]; then
            echo "::error::El deploy borraría estas entradas de public_html/ porque no las produce el build ni están en deploy-protect.txt:"
            sed 's/^/  - /' /tmp/en-peligro.txt
            echo "Si son subdominios o contenido que debe vivir, añádelos a deploy-protect.txt y vuelve a lanzar."
            exit 1
          fi
          echo "OK: nada sin proteger. El servidor tiene $(wc -l < /tmp/en-servidor.txt) entradas y ninguna corre peligro."

      - name: Deploy SPA via SSH (rsync)
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: ${{ steps.protect.outputs.switches }}
          path: dist/
          remote_path: /home/u567580447/domains/dakagency.net/public_html/
          remote_host: 89.116.115.11
          remote_port: 65002
          remote_user: u567580447
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Despliega el tema WordPress explícitamente (antes nunca llegaba al
      # servidor vía CI: deploy.sh solo funcionaba ejecutado en el servidor).
      # Scoped al directorio del tema — no toca nada más del blog.
      - name: Deploy WordPress theme via SSH (rsync)
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz
          path: wordpress-theme/dak-informando/
          remote_path: /home/u567580447/domains/dakagency.net/public_html/blog/wp-content/themes/dak-informando/
          remote_host: 89.116.115.11
          remote_port: 65002
          remote_user: u567580447
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
