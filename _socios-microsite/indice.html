<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Documentos de socios — DAK Agency</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
<meta name="referrer" content="no-referrer" />
<meta name="theme-color" content="#123A2A" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo+Narrow:wght@400;700&family=Archivo:wght@400;700&display=swap" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23123A2A'/%3E%3Crect x='5' y='7' width='22' height='5' fill='%23D93A14'/%3E%3Crect x='5' y='15' width='22' height='3' fill='%23EFEAD8'/%3E%3Crect x='5' y='21' width='14' height='3' fill='%23EFEAD8'/%3E%3C/svg%3E" />
<style>
:root{--tinta:#123A2A;--senal:#D93A14;--senal-texto:#A82A0B;--papel:#DDD6C4;--calado:#F1ECDE;--apagado:#9FB3A9;--exp:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100svh;background:var(--tinta);color:var(--calado);
  font-family:Archivo,system-ui,sans-serif;font-size:15px;line-height:1.6;
  display:grid;place-items:center;padding:clamp(1.5rem,5vw,3rem);position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background-image:radial-gradient(currentColor .9px,transparent .9px);background-size:7px 7px;opacity:.13}
::selection{background:var(--senal);color:#fff}
:focus-visible{outline:3px solid var(--senal);outline-offset:3px}
.caja{width:min(720px,100%);position:relative;z-index:1}
h1{font-family:'Archivo Black',system-ui,sans-serif;font-weight:400;text-transform:uppercase;
  font-size:clamp(2rem,1.3rem + 3vw,3.2rem);line-height:.95;letter-spacing:-.03em;margin-bottom:.9rem}
.frase{color:var(--papel);max-width:46ch}
.regla{border-top:6px solid var(--calado);border-bottom:2px solid var(--calado);height:11px;margin:1.8rem 0}
a.doc{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:center;
  border:4px solid var(--calado);padding:1.15rem 1.3rem;text-decoration:none;color:inherit;
  transition:background .22s var(--exp),color .22s var(--exp),border-color .22s var(--exp)}
a.doc:hover,a.doc:focus-visible{background:var(--senal);border-color:var(--senal);color:#fff}
a.doc h2{font-family:'Archivo Black',system-ui,sans-serif;font-weight:400;text-transform:uppercase;
  font-size:clamp(1.1rem,.9rem + .8vw,1.5rem);letter-spacing:-.02em;line-height:1.05;margin-bottom:.3rem}
a.doc p{font-family:'Archivo Narrow',system-ui,sans-serif;font-size:.88rem;letter-spacing:.03em;color:var(--apagado)}
a.doc:hover p,a.doc:focus-visible p{color:#FFE2D9}
a.doc .flecha{font-family:'Archivo Black',system-ui,sans-serif;font-size:1.5rem;line-height:1}
.pie{margin-top:2rem;padding-top:.85rem;border-top:2px solid #3B6153;
  font-family:'Archivo Narrow',system-ui,sans-serif;font-size:.85rem;letter-spacing:.03em;color:var(--apagado);
  display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.pie a{color:var(--calado)}
</style>
</head>
<body>
  <main class="caja">
    <h1>Documentos de socios</h1>
    <p class="frase">Papel de trabajo de la sociedad. No circula fuera de ella.</p>
    <div class="regla"></div>

    <a class="doc" href="/jetc/">
      <span>
        <h2>Convenio Grupo Inmobiliario JETC</h2>
        <p>373 lotes · el contrato se decide en 7,9 lotes al mes · 24 ago 2026</p>
      </span>
      <span class="flecha" aria-hidden="true">→</span>
    </a>

    <div class="pie">
      <span>DAK Agency · Chiclayo</span>
      <a href="/?salir=1">Cerrar sesión</a>
    </div>
  </main>
</body>
</html>
