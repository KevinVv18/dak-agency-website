<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400" role="img" aria-label="Bidón de bioestimulante agrícola">
  <defs>
    <linearGradient id="ag-cuerpo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2F4F0"/>
      <stop offset=".18" stop-color="#FFFFFF"/>
      <stop offset=".62" stop-color="#E4E8E2"/>
      <stop offset="1" stop-color="#BFC6BD"/>
    </linearGradient>
    <linearGradient id="ag-liquido" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3F8A24"/>
      <stop offset=".35" stop-color="#5AA02C"/>
      <stop offset="1" stop-color="#2E6B1A"/>
    </linearGradient>
    <linearGradient id="ag-tapa" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F2A22"/>
      <stop offset=".3" stop-color="#3C4A3F"/>
      <stop offset="1" stop-color="#161E19"/>
    </linearGradient>
    <clipPath id="ag-recorte">
      <path d="M74 132h152a16 16 0 0 1 16 16v196a16 16 0 0 1-16 16H74a16 16 0 0 1-16-16V148a16 16 0 0 1 16-16z"/>
    </clipPath>
  </defs>

  <!-- asa -->
  <path d="M226 168h22a26 26 0 0 1 26 26v44a26 26 0 0 1-26 26h-22" fill="none" stroke="#B3BBB1" stroke-width="17" stroke-linecap="round"/>
  <path d="M226 168h22a26 26 0 0 1 26 26v44a26 26 0 0 1-26 26h-22" fill="none" stroke="#DDE3DB" stroke-width="7" stroke-linecap="round"/>

  <!-- cuello y tapa -->
  <rect x="122" y="86" width="56" height="44" rx="7" fill="#CBD2C8"/>
  <rect x="112" y="60" width="76" height="34" rx="10" fill="url(#ag-tapa)"/>
  <g stroke="#5C6B5F" stroke-width="2" opacity=".55">
    <path d="M120 66v22M132 64v26M144 64v26M156 64v26M168 64v26M180 66v22"/>
  </g>
  <rect x="112" y="86" width="76" height="6" rx="3" fill="#0F1512" opacity=".35"/>

  <!-- cuerpo -->
  <path d="M74 132h152a16 16 0 0 1 16 16v196a16 16 0 0 1-16 16H74a16 16 0 0 1-16-16V148a16 16 0 0 1 16-16z" fill="url(#ag-cuerpo)"/>

  <!-- líquido visible por la franja de nivel -->
  <g clip-path="url(#ag-recorte)">
    <rect x="58" y="238" width="200" height="122" fill="url(#ag-liquido)"/>
    <rect x="58" y="238" width="200" height="7" fill="#7FBF4B" opacity=".85"/>
  </g>

  <!-- etiqueta: es una ficha técnica, con su cabecera y sus filas de datos -->
  <rect x="72" y="150" width="156" height="118" rx="3" fill="#FBFAF8" stroke="#C3BCAD" stroke-width="1.5"/>
  <rect x="72" y="150" width="156" height="26" rx="3" fill="#17603A"/>
  <rect x="72" y="170" width="156" height="6" fill="#17603A"/>

  <!-- marca: tres surcos sobre la línea de horizonte -->
  <g stroke="#FBFAF8" stroke-width="2.4" stroke-linecap="square">
    <path d="M84 168h22"/>
    <path d="M87 164h7M91 160h8M97 172h9" stroke-width="2" opacity=".6"/>
  </g>
  <rect x="116" y="159" width="52" height="7" rx="1" fill="#FBFAF8" opacity=".92"/>
  <rect x="174" y="160" width="26" height="5" rx="1" fill="#8FC0A4"/>

  <!-- filas de la etiqueta -->
  <g fill="#474E54">
    <rect x="82" y="188" width="62" height="5" rx="1"/>
    <rect x="82" y="202" width="48" height="5" rx="1"/>
    <rect x="82" y="216" width="56" height="5" rx="1"/>
    <rect x="82" y="230" width="40" height="5" rx="1"/>
  </g>
  <g fill="#A05A00">
    <rect x="164" y="188" width="34" height="6" rx="1"/>
    <rect x="164" y="202" width="26" height="6" rx="1"/>
    <rect x="164" y="216" width="30" height="6" rx="1"/>
    <rect x="164" y="230" width="22" height="6" rx="1"/>
  </g>
  <g stroke="#DDD8CD" stroke-width="1">
    <path d="M78 196h144M78 210h144M78 224h144M78 238h144"/>
  </g>

  <!-- sello de admisibilidad orgánica -->
  <circle cx="196" cy="252" r="13" fill="#E5EFE8" stroke="#17603A" stroke-width="2"/>
  <path d="M190 252l4.4 4.4L203 248" fill="none" stroke="#17603A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- franja de nivel y reflejo -->
  <rect x="72" y="286" width="156" height="26" rx="3" fill="#FBFAF8" opacity=".16"/>
  <g stroke="#FBFAF8" stroke-width="2" opacity=".5">
    <path d="M84 292h18M84 300h18M84 306h11"/>
  </g>
  <path d="M84 146v198" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity=".45"/>
  <path d="M222 152v186" stroke="#7C857A" stroke-width="5" stroke-linecap="round" opacity=".35"/>

  <!-- base -->
  <rect x="66" y="352" width="168" height="10" rx="5" fill="#9BA399" opacity=".55"/>
</svg>
