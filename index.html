  <!-- Schema JSON-LD.
       Solo se declara lo que la pagina muestra de verdad: los precios salen de
       la seccion de servicios y el horario del bloque de contacto.

       NO lleva "geo": el unico dato de coordenadas del sitio es el pin del mapa
       del footer, que apunta a 8°06'43.2"S 79°02'40.8"W — unos 147 km al sur de
       Chiclayo, en La Libertad. Hasta que se corrija el pin con la direccion
       real, publicar esas coordenadas en el schema empeoraria el SEO local en
       vez de mejorarlo.

       Tampoco lleva "aggregateRating": los tres testimonios de la home son
       citas de clientes, no un sistema de resenas verificables. Declararlos
       como valoracion agregada expone a una accion manual de Google. -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "MarketingAgency",
          "@id": "https://dakagency.net/#organizacion",

          "logo": "https://dakagency.net/og-image.png",
          "image": "https://dakagency.net/og-image.png",

          "priceRange": "S/ 600 - S/ 2500",
          "currenciesAccepted": "PEN",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "La Victoria, Chiclayo",
            "addressRegion": "Lambayeque",
            "addressCountry": "PE"
          },
          "openingHoursSpecification": [
            {
              "@type": "OpeningHoursSpecification",
              "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
              "opens": "09:00",
              "closes": "18:00"
            }
          ],
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+51-906-765-040",
            "contactType": "customer service",
            "email": "marketing@dakagency.net",
            "areaServed": "PE",
            "availableLanguage": "Spanish"
          },
          "areaServed": [
            { "@type": "City", "name": "Chiclayo" },
            { "@type": "AdministrativeArea", "name": "Lambayeque" },
            { "@type": "Country", "name": "Perú" }
          ],
          "sameAs": [
            "https://www.facebook.com/profile.php?id=61577374078273",
            "https://www.instagram.com/agency_dak/",
            "https://www.tiktok.com/@dakagency"
          ],
          "knowsAbout": ["SEO", "Diseño Web", "Automatización de Marketing", "Branding", "Campañas Meta Ads", "Fotografía"],
          "hasOfferCatalog": { "@id": "https://dakagency.net/#servicios" }
        },
        {
          "@type": "OfferCatalog",
          "@id": "https://dakagency.net/#servicios",
          "name": "Servicios de DAK Agency",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "Branding", "description": "Tu marca, inolvidable", "provider": { "@id": "https://dakagency.net/#organizacion" } },
              "priceSpecification": { "@type": "PriceSpecification", "minPrice": 1500, "priceCurrency": "PEN" }
            },
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "Fotografía", "description": "Imágenes que venden por ti", "provider": { "@id": "https://dakagency.net/#organizacion" } },
              "priceSpecification": { "@type": "PriceSpecification", "minPrice": 800, "priceCurrency": "PEN" }
            },
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "Video", "description": "Historias que conectan", "provider": { "@id": "https://dakagency.net/#organizacion" } },
              "priceSpecification": { "@type": "PriceSpecification", "minPrice": 2000, "priceCurrency": "PEN" }
            },
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "Social Media", "description": "Convierte seguidores en clientes", "provider": { "@id": "https://dakagency.net/#organizacion" } },
