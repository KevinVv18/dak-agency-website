  <!-- Schema JSON-LD.
       Solo se declara lo que la pagina muestra de verdad: los precios salen de
       la seccion de servicios y el horario del bloque de contacto.

       Las coordenadas de "geo" corresponden al Condominio Los Parques de San
       Gabriel y estan verificadas contra OpenStreetMap: tres consultas
       independientes (el condominio, su salon de usos multiples y la Av. Victor
       Andres Belaunde) caen dentro de 250 m. Se usan 4 decimales (~11 m) porque
       mas seria precision fingida para el centroide de un condominio. Deben
       coincidir con el iframe del mapa en Footer.jsx.

       NO lleva "aggregateRating": los tres testimonios de la home son citas de
       clientes, no un sistema de resenas verificables. Declararlos como
       valoracion agregada expone a una accion manual de Google. -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "MarketingAgency",
          "@id": "https://dakagency.net/#organizacion",
          "name": "DAK Agency",
          "alternateName": "Digital Acceleration Key",
          "url": "https://dakagency.net/",
          "logo": "https://dakagency.net/og-image.png",
          "image": "https://dakagency.net/og-image.png",
          "description": "Agencia de marketing digital en Chiclayo, Lambayeque, Perú. Ofrecemos diseño de páginas web, automatización, branding, campañas de Meta Ads y fotografía comercial.",
          "priceRange": "S/ 600 - S/ 2500",
          "currenciesAccepted": "PEN",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Av. Víctor Andrés Belaunde 101, Condominio Los Parques de San Gabriel",
            "addressLocality": "Chiclayo",
            "addressRegion": "Lambayeque",
            "postalCode": "14011",
            "addressCountry": "PE"
          },
          "geo": {
            "@type": "GeoCoordinates",
            "latitude": -6.7744,
            "longitude": -79.8747
          },
          "hasMap": "https://maps.google.com/maps?q=-6.7744,-79.8747",
          "openingHoursSpecification": [
            {
              "@type": "OpeningHoursSpecification",
              "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
              "opens": "09:00",
              "closes": "18:00"
            }
          ],
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+51-906-765-040",
            "contactType": "customer service",
            "email": "marketing@dakagency.net",
            "areaServed": "PE",
            "availableLanguage": "Spanish"
          },
          "areaServed": [
            { "@type": "City", "name": "Chiclayo" },
            { "@type": "AdministrativeArea", "name": "Lambayeque" },
            { "@type": "Country", "name": "Perú" }
          ],
          "sameAs": [
            "https://www.facebook.com/profile.php?id=61577374078273",
            "https://www.instagram.com/agency_dak/",
            "https://www.tiktok.com/@dakagency"
          ],
          "knowsAbout": ["SEO", "Diseño Web", "Automatización de Marketing", "Branding", "Campañas Meta Ads", "Fotografía"],
          "hasOfferCatalog": { "@id": "https://dakagency.net/#servicios" }
        },
        {
          "@type": "OfferCatalog",
          "@id": "https://dakagency.net/#servicios",
          "name": "Servicios de DAK Agency",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "Branding", "description": "Tu marca, inolvidable", "provider": { "@id": "https://dakagency.net/#organizacion" } },
              "priceSpecification": { "@type": "PriceSpecification", "minPrice": 1500, "priceCurrency": "PEN" }
            },
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "Fotografía", "description": "Imágenes que venden por ti", "provider": { "@id": "https://dakagency.net/#organizacion" } },
              "priceSpecification": { "@type": "PriceSpecification", "minPrice": 800, "priceCurrency": "PEN" }
            },
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "Video", "description": "Historias que conectan", "provider": { "@id": "https://dakagency.net/#organizacion" } },
              "priceSpecification": { "@type": "PriceSpecification", "minPrice": 2000, "priceCurrency": "PEN" }
            },
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "Social Media", "description": "Convierte seguidores en clientes", "provider": { "@id": "https://dakagency.net/#organizacion" } },
              "priceSpecification": { "@type": "UnitPriceSpecification", "minPrice": 600, "priceCurrency": "PEN", "unitCode": "MON", "unitText": "mes" }
            },
            {
              "@type": "Offer",

              "priceSpecification": { "@type": "PriceSpecification", "minPrice": 2500, "priceCurrency": "PEN" }

          "name": "DAK Agency",
          "inLanguage": "es-PE",

        }
